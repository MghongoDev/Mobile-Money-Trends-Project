[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-money-trends"
version = "1.0.0"
description = "Pure-Python mobile money adoption trend analysis and forecasting (Streamlit dashboard)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mobile Money Trends Project" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "requests>=2.31",
    "shap>=0.44",
    "optuna>=3.5",
    "streamlit>=1.32",
    "altair>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
mobile-money = "mobile_money_project.cli:main"

[tool.setuptools.packages.find]
include = ["mobile_money_project*"]
